#! products




# Create prod ====================================================================================
# normal
- case_title: "test_create_product_success"
  description: "Create a new product successfully"
  action: "create_product"
  payload:
    name: "Test Laptop3"
    price: 4999.99
    stock: 50
    description: "A high-performance testing laptop"
  expected_status: 200
  expected_code: 200
  expected_msg: "seccess"

# Not name
- case_title: "test_create_product_not_name"
  description: "Create a new prod failed as name is null"
  action: "create_product"
  payload:
    name: ""
    price: 4999.99
    stock: 50
    description: "A high-performance testing laptop"
  expected_status: 200
  expected_code: 422
  expected_msg: "error"

# Not price
- case_title: "test_create_product_not_price"
  description: "Create a new prod failed as price is null"
  action: "create_product"
  payload:
    name: "TSL iphone zore pro"
    price: ""
    stock: 50
    description: "A high-performance testing laptop"
  expected_status: 200
  expected_code: 422
  expected_msg: "error"

# Not stock
- case_title: "test_create_product_not_stock"
  description: "Create a new prod failed as stock is null"
  action: "create_product"
  payload:
    name: "TSL iphone zore pro"
    price: "101999"
    stock: ""
    description: "A high-performance testing laptop"
  expected_status: 200
  expected_code: 422
  expected_msg: "error"


# Get prod =================================================================================================================
- case_title: "test_get_product_all_fetch_success"
  description: "Get all product details"
