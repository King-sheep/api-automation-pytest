    name: ""
    price: ""
    stock: ""
    description: ""
    ids: []
  expected_status: 200
  expected_code: 200
  expected_msg: "success"

- case_title: "test_get_product_by_ids_success"
  description: "Get product details by prod id"
  action: "get_products"
  payload:
    name: ""
    price: ""
    stock: ""
    description: ""
    ids: [1, 2]
  expected_status: 200
  expected_code: 200
  expected_msg: "success"


# update prod =======================================================================
- case_title: "test_update_product_success"
  description: "Update product details successfully"
  action: "update_product"
