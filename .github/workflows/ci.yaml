name: API Automation CI & Report

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Automatically start a MySQL database service in the cloud runner
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "SheepWang123456@"
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    # 1. Checkout repository source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python runtime environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

   # 3. Install core dependencies and requirements
    - name: Install Dependencies
      run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn[standard] pymysql requests pytest pytest-html allure-pytest sqlalchemy pydantic
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt || true
          fi

    # 4. Initialize database schema using SQL script
    - name: Import Database SQL
      run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p"SheepWang123456@" test_db < api_init.sql

  # 5. Start FastAPI Server using direct file path
    - name: Start FastAPI Server
      run: |
          export MYSQL_PASSWORD="SheepWang123456@"
          export PYTHONPATH=$PWD
          
          echo "Current directory: $PWD"
          ls -la
          
          # 直接用路径方式启动，避免模块导入路径对齐问题
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          
          # 等待服务启动
          echo "Waiting for FastAPI to start..."
          for i in {1..10}; do
            if nc -z 127.0.0.1 8000; then
              echo "FastAPI started successfully!"
              exit 0
            fi
            sleep 1
          done
          
          echo "ERROR: FastAPI failed to start! Printing server.log:"
          cat server.log
          exit 1

    # 6. Execute pytest suite and generate HTML test report
    - name: Run Pytest with HTML Report
      run: |
        pytest --html=report.html --self-contained-html || true

    # 7. Upload generated HTML report as an artifact
    - name: Upload HTML Test Report
      uses: actions/upload-artifact@v4
      with:
        name: pytest-html-report
        path: report.html