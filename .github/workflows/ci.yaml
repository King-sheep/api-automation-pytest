name: API Automation CI & Report

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout API automation project
      - name: Checkout API Automation Project
        uses: actions/checkout@v4

      # 2. Checkout FastAPI backend project
      - name: Checkout E-Business Backend
        uses: actions/checkout@v4
        with:
          repository: King-sheep/E-Business
          path: E-Business

      # 3. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r E-Business/requirements.txt
          python -m pip install pytest-html

      # 5. Manually start MySQL container (No rigid healthcheck to fail)
      - name: Start MySQL Container
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          docker run -d \
            --name mysql \
            -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="${MYSQL_PASSWORD}" \
            -e MYSQL_DATABASE=test_db \
            mysql:8.0

          echo "Waiting for MySQL to be fully ready..."
          for i in {1..30}; do
            if docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_PASSWORD}" --silent; then
              echo "MySQL is up and running!"
              break
            fi
            echo "Waiting... $i"
            sleep 3
          done

      # 6. Initialize database
      - name: Import Database SQL
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          mysql -h 127.0.0.1 \
                -P 3306 \
                -u root \
                -p"${MYSQL_PASSWORD}" \
                test_db < api_init.sql

      # 7. Start FastAPI backend
      - name: Start FastAPI Server
        working-directory: E-Business
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}/E-Business
        run: |
          echo "Current directory: $(pwd)"
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > server.log 2>&1 &

          echo "Waiting for FastAPI to start..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "FastAPI started successfully!"
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: FastAPI failed to start! Printing server.log:"
          cat server.log
          exit 1

      # 8. Run API automation tests
      - name: Run Pytest with HTML Report
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          pytest \
            --html=report.html \
            --self-contained-html

      # 9. Upload test report
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html