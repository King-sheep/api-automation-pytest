name: API Automation CI & Report

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Start MySQL service (simplified healthcheck to avoid container startup failure)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:

      # 2. Checkout API automation project
      - name: Checkout API Automation Project
        uses: actions/checkout@v4

      # 3. Checkout FastAPI backend project (ChatGPT's advantage)
      - name: Checkout E-Business Backend
        uses: actions/checkout@v4
        with:
          repository: King-sheep/E-Business
          path: E-Business

      # 4. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 5. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          # API automation dependencies
          python -m pip install -r requirements.txt

          # FastAPI backend dependencies
          python -m pip install -r E-Business/requirements.txt

          # Test reporting & network tools
          python -m pip install pytest-html

      # 6. Initialize database (with robust waiting loop)
      - name: Import Database SQL
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          echo "Waiting for MySQL port to be ready..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 3306; then
              echo "MySQL is up and running!"
              break
            fi
            sleep 2
          done

          mysql -h 127.0.0.1 \
                -P 3306 \
                -u root \
                -p"${MYSQL_PASSWORD}" \
                test_db < api_init.sql

      # 7. Start FastAPI backend (in E-Business directory)
      - name: Start FastAPI Server
        working-directory: E-Business
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          PYTHONPATH: ${{ github.workspace }}/E-Business
        run: |
          echo "Current directory: $(pwd)"
          echo "Python path: $PYTHONPATH"
          ls -la

          # Start FastAPI in background
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > server.log 2>&1 &

          echo "Waiting for FastAPI to start..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "FastAPI started successfully!"
              exit 0
            fi
            echo "Waiting... $i"
            sleep 2
          done

          echo "ERROR: FastAPI failed to start! Printing server.log:"
          cat server.log
          exit 1

      # 8. Run API automation tests
      - name: Run Pytest with HTML Report
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          pytest \
            --html=report.html \
            --self-contained-html

      # 9. Upload test report
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html