name: API Automation CI & Report

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Automatically start a MySQL database service in the cloud runner
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "SheepWang123456@"
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    # 2. Checkout repository source code
    - name: Checkout code
      uses: actions/checkout@v4

    # 3. Set up Python runtime environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 4. Install project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # 5. Automatically import api_init.sql into the cloud MySQL instance
    - name: Import Database SQL
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -p"SheepWang123456@" test_db < api_init.sql

    # 6. Start FastAPI application in the background
    - name: Start FastAPI server
      run: |
        export MYSQL_PASSWORD="SheepWang123456@"
        nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
        
        # Wait up to 10 seconds for port 8000 to become active
        echo "Waiting for FastAPI to start..."
        for i in {1..10}; do
          if nc -z 127.0.0.1 8000; then
            echo "FastAPI started successfully!"
            exit 0
          fi
          sleep 1
        done
        
        echo "ERROR: FastAPI failed to start! Printing server.log:"
        cat server.log
        exit 1

    # 7. Execute Pytest suite and generate HTML test report
    - name: Run Pytest with HTML Report
      run: |
        pytest -v --html=report.html --self-contained-html

    # 8. Upload the generated HTML report as a workflow artifact
    - name: Upload HTML Test Report
      uses: actions/upload-artifact@v4
      if: always()  # Always upload regardless of test success or failure
      with:
        name: html-report
        path: report.html
        retention-days: 3