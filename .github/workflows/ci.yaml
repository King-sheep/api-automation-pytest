name: API Automation CI & Report

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository source code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python runtime environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute Pytest suite and generate HTML test report
    - name: Run Pytest with HTML Report
      run: |
        pytest -v --html=report.html --self-contained-html

    # 5. Upload the generated HTML report as a workflow artifact
    - name: Upload HTML Test Report
      uses: actions/upload-artifact@v4
      with:
        name: html-report
        path: report.html
        retention-days: 3