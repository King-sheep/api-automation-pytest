name: Run Pytest Automation

# Trigger conditions: Run automatically on code push or pull requests to main/master branches
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest # Run tests on a free GitHub-hosted Ubuntu runner

    steps:
    # Step 1: Check out the repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 3: Install required dependencies (pip, pytest, requests)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests

    # Step 4: Execute Pytest test suite
    - name: Run Pytest
      run: |
        pytest